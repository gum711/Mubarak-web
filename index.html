<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مبارك المالكي · IT Support & Network Systems</title>
  <meta name="description" content="مبارك المالكي، أخصائي دعم فني وإدارة أنظمة شبكات." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;500;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <main id="scroll">
    <div class="stage" id="stage">

      <!-- ============ SCENE: ROOM ============ -->
      <svg id="room" class="scene-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <radialGradient id="g-red" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ff2a3d" stop-opacity=".55" />
            <stop offset=".5" stop-color="#ff2a3d" stop-opacity=".12" />
            <stop offset="1" stop-color="#ff2a3d" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="g-green" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#2bffa3" stop-opacity=".45" />
            <stop offset=".5" stop-color="#2bffa3" stop-opacity=".1" />
            <stop offset="1" stop-color="#2bffa3" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="g-warm" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffb35c" stop-opacity=".5" />
            <stop offset="1" stop-color="#ffb35c" stop-opacity="0" />
          </radialGradient>
          <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="2" fill="#000" opacity=".35" />
          </pattern>
          <filter id="blur-soft"><feGaussianBlur stdDeviation="3" /></filter>
        </defs>

        <rect x="-3000" y="-3000" width="7600" height="6900" fill="#05070b" />
        <!-- wall glows -->
        <g id="room-glow-red"><g class="flicker-glow"><ellipse cx="800" cy="430" rx="720" ry="460" fill="url(#g-red)" /></g></g>
        <g id="room-glow-green" opacity="0"><ellipse cx="800" cy="430" rx="720" ry="460" fill="url(#g-green)" /></g>
        <g id="lamp-glow" opacity="0"><ellipse cx="430" cy="470" rx="380" ry="300" fill="url(#g-warm)" /></g>

        <!-- window blinds, very faint -->
        <g opacity=".05" fill="#9fb3c8">
          <rect x="1230" y="150" width="220" height="6" /><rect x="1230" y="172" width="220" height="6" />
          <rect x="1230" y="194" width="220" height="6" /><rect x="1230" y="216" width="220" height="6" />
          <rect x="1230" y="238" width="220" height="6" /><rect x="1230" y="260" width="220" height="6" />
        </g>

        <!-- floor + desk -->
        <rect x="-3000" y="740" width="7600" height="3000" fill="#030407" />
        <rect x="330" y="606" width="940" height="20" rx="4" fill="#0c1018" />
        <rect x="360" y="626" width="16" height="200" fill="#080b11" />
        <rect x="1224" y="626" width="16" height="200" fill="#080b11" />

        <!-- desk lamp -->
        <g fill="#0b0e15">
          <rect x="400" y="596" width="70" height="10" rx="3" />
          <rect x="430" y="500" width="8" height="100" transform="rotate(-12 434 550)" />
          <path d="M405 470 L470 470 L455 500 L420 500 Z" />
        </g>
        <ellipse id="lamp-bulb" cx="437" cy="502" rx="16" ry="4" fill="#ffcf8a" opacity="0" />

        <!-- PC tower -->
        <rect x="1090" y="460" width="120" height="146" rx="6" fill="#090c12" stroke="#151b26" stroke-width="2" />
        <circle id="tower-led" cx="1112" cy="480" r="4" fill="#ff2a3d" />
        <rect x="1104" y="500" width="92" height="3" fill="#121823" />
        <rect x="1104" y="510" width="92" height="3" fill="#121823" />

        <!-- monitor -->
        <rect x="785" y="565" width="30" height="45" fill="#0a0d13" />
        <ellipse cx="800" cy="608" rx="70" ry="6" fill="#0a0d13" />
        <rect x="560" y="300" width="480" height="270" rx="10" fill="#090b10" stroke="#1a1f2a" stroke-width="3" />
        <g id="screen">
          <g id="screen-error">
            <rect x="574" y="314" width="452" height="242" fill="#1d0207" />
            <g class="flicker-screen">
              <path d="M800 338 L832 392 L768 392 Z" fill="none" stroke="#ff3b4e" stroke-width="5" stroke-linejoin="round" />
              <rect x="797" y="356" width="6" height="20" fill="#ff3b4e" />
              <rect x="797" y="381" width="6" height="6" fill="#ff3b4e" />
              <text x="800" y="452" text-anchor="middle" class="mono" font-size="62" font-weight="700" fill="#ff3b4e" letter-spacing="8">ERROR</text>
              <text x="800" y="482" text-anchor="middle" class="mono" font-size="15" fill="#ff8a95" opacity=".8">SYSTEM_FAILURE · 0x0000007B</text>
            </g>
          </g>
          <g id="screen-ok" opacity="0">
            <rect x="574" y="314" width="452" height="242" fill="#02150f" />
            <circle cx="800" cy="398" r="40" fill="none" stroke="#2bffa3" stroke-width="6" />
            <path d="M780 398 L795 413 L822 385" fill="none" stroke="#2bffa3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
            <text x="800" y="478" text-anchor="middle" class="mono" font-size="26" font-weight="700" fill="#2bffa3" letter-spacing="4">SYSTEM RESTORED</text>
          </g>
          <rect x="574" y="314" width="452" height="242" fill="url(#scanlines)" />
        </g>

        <!-- keyboard -->
        <rect x="690" y="596" width="220" height="10" rx="3" fill="#0d1119" />

        <!-- person silhouette, seen from behind (wearing hoodie hood) -->
        <g id="person">
          <!-- Hoodie body and broad shoulders -->
          <path d="M595 900 C 602 785, 628 708, 692 678 C 728 661, 764 654, 800 654 C 836 654, 872 661, 908 678 C 972 708, 998 785, 1005 900 Z" fill="#000" />
          <!-- Hoodie collar / gathered fabric folds at neck base -->
          <path d="M700 676 Q 748 644 800 650 Q 852 644 900 676 Q 855 712 800 714 Q 745 712 700 676 Z" fill="#000" />
          <!-- Hoodie hood (كبوع الهودي) pulled up over the head with soft crown peak and side drape -->
          <path d="M718 672 C 710 632, 712 570, 730 526 C 748 486, 776 466, 800 462 C 824 466, 852 486, 870 526 C 888 570, 890 632, 882 672 Z" fill="#000" />
          <!-- Subtle dark fabric crease lines inside the black silhouette so the hood & pullover read clearly -->
          <path d="M736 664 C 734 612, 744 548, 770 500 M864 664 C 866 612, 856 548, 830 500" fill="none" stroke="#0d121b" stroke-width="2.5" stroke-linecap="round" />
          <path d="M722 678 Q 800 704 878 678 M746 692 Q 800 714 854 692" fill="none" stroke="#0d121b" stroke-width="2.5" stroke-linecap="round" />
          <path d="M800 464 C 798 518, 799 585, 800 648" fill="none" stroke="#0a0e16" stroke-width="2" stroke-linecap="round" />
          <!-- chair back (low enough to show hoodie back & hood clearly) -->
          <rect x="655" y="758" width="290" height="220" rx="44" fill="#020305" stroke="#0b0f17" stroke-width="2" />
        </g>
      </svg>

      <!-- ============ SCENE: TERMINAL ============ -->
      <div id="terminal" class="terminal" aria-hidden="true">
        <div class="term-lines mono">
          <p data-line="> SYSTEM FAILURE DETECTED" class="t-red"></p>
          <p data-line="> Running auto-repair....... FAILED" class="t-red"></p>
          <p data-line="> Calling technician..." class="t-dim"></p>
          <p data-line="> Connected ✓" class="t-green"></p>
        </div>
        <div class="intro">
          <h1 id="intro-name"></h1>
          <p id="intro-title" class="mono"></p>
        </div>
      </div>

      <!-- ============ SCENE: PC INTERIOR ============ -->
      <svg id="pc" class="scene-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <radialGradient id="g-heat" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ff3b1e" stop-opacity=".85" />
            <stop offset=".6" stop-color="#ff3b1e" stop-opacity=".2" />
            <stop offset="1" stop-color="#ff3b1e" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="g-cool" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#2be0ff" stop-opacity=".55" />
            <stop offset="1" stop-color="#2be0ff" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="g-scan" x1="0" x2="1">
            <stop offset="0" stop-color="#2be0ff" stop-opacity="0" />
            <stop offset=".8" stop-color="#2be0ff" stop-opacity=".35" />
            <stop offset="1" stop-color="#bff6ff" stop-opacity="1" />
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <pattern id="pcb" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M0 20 H14 L20 14 V0 M40 26 H26 L20 32 V40" stroke="#14382d" stroke-width="2" fill="none" />
            <circle cx="20" cy="14" r="2" fill="#1a4a3b" /><circle cx="20" cy="32" r="2" fill="#1a4a3b" />
          </pattern>
          <g id="blade"><path d="M0 0 C 14 -34, 46 -46, 60 -30 C 44 -20, 22 -8, 0 0 Z" /></g>
        </defs>

        <rect x="-3000" y="-3000" width="7600" height="6900" fill="#05070b" />

        <!-- case -->
        <rect x="300" y="80" width="1000" height="740" rx="18" fill="#090c12" stroke="#1d2431" stroke-width="4" />
        <g fill="#0e131c">
          <rect x="316" y="110" width="40" height="6" rx="3" /><rect x="316" y="126" width="40" height="6" rx="3" />
          <rect x="316" y="142" width="40" height="6" rx="3" /><rect x="316" y="158" width="40" height="6" rx="3" />
        </g>

        <!-- front case fans -->
        <g class="case-fans" fill="#121925">
          <g transform="translate(1180 230)"><circle r="82" fill="#070a0f" stroke="#1a2130" stroke-width="3" /><g class="spin-slow"><use href="#blade" transform="rotate(0)" /><use href="#blade" transform="rotate(72)" /><use href="#blade" transform="rotate(144)" /><use href="#blade" transform="rotate(216)" /><use href="#blade" transform="rotate(288)" /></g><circle r="14" fill="#1a2130" /></g>
          <g transform="translate(1180 450)"><circle r="82" fill="#070a0f" stroke="#1a2130" stroke-width="3" /><g class="spin-slow"><use href="#blade" transform="rotate(0)" /><use href="#blade" transform="rotate(72)" /><use href="#blade" transform="rotate(144)" /><use href="#blade" transform="rotate(216)" /><use href="#blade" transform="rotate(288)" /></g><circle r="14" fill="#1a2130" /></g>
          <g transform="translate(1180 670)"><circle r="82" fill="#070a0f" stroke="#1a2130" stroke-width="3" /><g class="spin-slow"><use href="#blade" transform="rotate(0)" /><use href="#blade" transform="rotate(72)" /><use href="#blade" transform="rotate(144)" /><use href="#blade" transform="rotate(216)" /><use href="#blade" transform="rotate(288)" /></g><circle r="14" fill="#1a2130" /></g>
        </g>

        <!-- motherboard -->
        <rect x="400" y="120" width="640" height="520" rx="8" fill="#0b1613" stroke="#173a2f" stroke-width="2" />
        <rect x="400" y="120" width="640" height="520" rx="8" fill="url(#pcb)" opacity=".7" />
        <rect x="400" y="140" width="44" height="230" fill="#141a24" />

        <!-- GPU (decor) -->
        <rect x="450" y="555" width="560" height="64" rx="6" fill="#0f141d" stroke="#222b3a" stroke-width="2" />
        <circle cx="620" cy="587" r="24" fill="#090c12" stroke="#222b3a" /><circle cx="840" cy="587" r="24" fill="#090c12" stroke="#222b3a" />
        <rect x="460" y="600" width="80" height="6" fill="#2be0ff" opacity=".35" />

        <!-- PSU -->
        <rect x="330" y="676" width="300" height="122" rx="8" fill="#0d1119" stroke="#1d2431" stroke-width="2" />
        <text x="480" y="745" text-anchor="middle" class="mono" font-size="16" fill="#3a4558">750W</text>

        <!-- ===== PART: CPU / COOLER ===== -->
        <g id="part-cpu">
          <circle id="cpu-heat" cx="620" cy="290" r="160" fill="url(#g-heat)" />
          <circle id="cpu-cool" cx="620" cy="290" r="150" fill="url(#g-cool)" opacity="0" />
          <rect x="525" y="195" width="190" height="190" rx="16" fill="#111722" stroke="#2a3344" stroke-width="3" />
          <circle cx="620" cy="290" r="82" fill="#070a0f" stroke="#2a3344" stroke-width="3" />
          <g id="fan"><g id="fan-idle" fill="#2a3446">
            <use href="#blade" transform="translate(620 290) rotate(0)" /><use href="#blade" transform="translate(620 290) rotate(51.4)" />
            <use href="#blade" transform="translate(620 290) rotate(102.8)" /><use href="#blade" transform="translate(620 290) rotate(154.2)" />
            <use href="#blade" transform="translate(620 290) rotate(205.6)" /><use href="#blade" transform="translate(620 290) rotate(257)" />
            <use href="#blade" transform="translate(620 290) rotate(308.4)" />
          </g></g>
          <circle cx="620" cy="290" r="18" fill="#1c2433" />
          <circle cx="538" cy="208" r="5" fill="#3a4558" /><circle cx="702" cy="208" r="5" fill="#3a4558" />
          <circle cx="538" cy="372" r="5" fill="#3a4558" /><circle cx="702" cy="372" r="5" fill="#3a4558" />
        </g>

        <!-- ===== PART: RAM (Detailed DDR5 / RGB Heatsink Modules) ===== -->
        <g id="part-ram">
          <!-- DIMM Slots with top & bottom retention latches -->
          <g fill="#05080e" stroke="#182232" stroke-width="1">
            <rect x="768" y="168" width="20" height="244" rx="2" />
            <rect x="798" y="168" width="20" height="244" rx="2" />
            <rect x="828" y="168" width="20" height="244" rx="2" />
            <rect x="858" y="168" width="20" height="244" rx="2" />
          </g>
          <!-- Slot latches (top & bottom) -->
          <g fill="#263348">
            <rect x="766" y="162" width="24" height="6" rx="1.5" /><rect x="766" y="412" width="24" height="6" rx="1.5" />
            <rect id="ram-latch-top" x="796" y="162" width="24" height="6" rx="1.5" /><rect id="ram-latch-bot" x="796" y="412" width="24" height="6" rx="1.5" />
            <rect x="826" y="162" width="24" height="6" rx="1.5" /><rect x="826" y="412" width="24" height="6" rx="1.5" />
            <rect x="856" y="162" width="24" height="6" rx="1.5" /><rect x="856" y="412" width="24" height="6" rx="1.5" />
          </g>

          <!-- Reusable RAM module template (Stick 1, 3, 4) -->
          <!-- Stick 1 (x=769) -->
          <g class="ram-stick">
            <!-- Gold contact pins at bottom edge -->
            <rect x="771" y="402" width="16" height="6" fill="#d4a74a" opacity=".75" />
            <!-- Brushed aluminum heatsink body -->
            <rect x="769" y="174" width="18" height="230" rx="2.5" fill="#162232" stroke="#2b3d56" stroke-width="1.2" />
            <!-- RGB Diffuser spine along full module with segments -->
            <rect x="770.5" y="176" width="5" height="226" rx="1.5" fill="#2be0ff" opacity=".85" />
            <!-- Heatsink fins & IC chip indentations -->
            <g fill="#0c131d">
              <rect x="777.5" y="184" width="7.5" height="18" rx="1" />
              <rect x="777.5" y="208" width="7.5" height="18" rx="1" />
              <rect x="777.5" y="232" width="7.5" height="18" rx="1" />
              <rect x="777.5" y="256" width="7.5" height="18" rx="1" />
              <rect x="777.5" y="290" width="7.5" height="18" rx="1" />
              <rect x="777.5" y="314" width="7.5" height="18" rx="1" />
              <rect x="777.5" y="338" width="7.5" height="18" rx="1" />
              <rect x="777.5" y="362" width="7.5" height="18" rx="1" />
            </g>
            <!-- Center metallic badge & notch -->
            <rect x="769" y="278" width="18" height="8" fill="#24354c" />
            <line x1="770.5" y1="220" x2="775.5" y2="220" stroke="#091019" stroke-width="1.5" />
            <line x1="770.5" y1="340" x2="775.5" y2="340" stroke="#091019" stroke-width="1.5" />
          </g>

          <!-- Stick 2: Faulty RAM Module (#ram-bad, x=799) -->
          <g id="ram-bad">
            <!-- Gold contact pins (visible when lifted out) -->
            <rect x="801" y="402" width="16" height="7" fill="#e5b84b" />
            <path d="M803 402 V409 M806 402 V409 M809 402 V409 M812 402 V409 M815 402 V409" stroke="#7c5d15" stroke-width="0.8" />
            <!-- Heatsink body -->
            <rect x="799" y="174" width="18" height="230" rx="2.5" fill="#162232" stroke="#2b3d56" stroke-width="1.2" />
            <!-- RGB Diffuser spine (starts red, turns cyan when fixed) -->
            <rect id="ram-bad-led" x="800.5" y="176" width="5" height="226" rx="1.5" fill="#ff3b4e" />
            <!-- IC Chips / Heatsink cutouts -->
            <g fill="#0c131d">
              <rect x="807.5" y="184" width="7.5" height="18" rx="1" />
              <rect x="807.5" y="208" width="7.5" height="18" rx="1" />
              <rect x="807.5" y="232" width="7.5" height="18" rx="1" />
              <rect x="807.5" y="256" width="7.5" height="18" rx="1" />
              <rect x="807.5" y="290" width="7.5" height="18" rx="1" />
              <rect x="807.5" y="314" width="7.5" height="18" rx="1" />
              <rect x="807.5" y="338" width="7.5" height="18" rx="1" />
              <rect x="807.5" y="362" width="7.5" height="18" rx="1" />
            </g>
            <rect x="799" y="278" width="18" height="8" fill="#24354c" />
            <line x1="800.5" y1="220" x2="805.5" y2="220" stroke="#091019" stroke-width="1.5" />
            <line x1="800.5" y1="340" x2="805.5" y2="340" stroke="#091019" stroke-width="1.5" />
            <!-- Fault red glow overlay -->
            <rect id="ram-bad-tint" x="799" y="174" width="18" height="230" rx="2.5" fill="#ff3b4e" opacity=".48" />
          </g>

          <!-- Stick 3 (x=829) -->
          <g class="ram-stick">
            <rect x="831" y="402" width="16" height="6" fill="#d4a74a" opacity=".75" />
            <rect x="829" y="174" width="18" height="230" rx="2.5" fill="#162232" stroke="#2b3d56" stroke-width="1.2" />
            <rect x="830.5" y="176" width="5" height="226" rx="1.5" fill="#2be0ff" opacity=".85" />
            <g fill="#0c131d">
              <rect x="837.5" y="184" width="7.5" height="18" rx="1" />
              <rect x="837.5" y="208" width="7.5" height="18" rx="1" />
              <rect x="837.5" y="232" width="7.5" height="18" rx="1" />
              <rect x="837.5" y="256" width="7.5" height="18" rx="1" />
              <rect x="837.5" y="290" width="7.5" height="18" rx="1" />
              <rect x="837.5" y="314" width="7.5" height="18" rx="1" />
              <rect x="837.5" y="338" width="7.5" height="18" rx="1" />
              <rect x="837.5" y="362" width="7.5" height="18" rx="1" />
            </g>
            <rect x="829" y="278" width="18" height="8" fill="#24354c" />
            <line x1="830.5" y1="220" x2="835.5" y2="220" stroke="#091019" stroke-width="1.5" />
            <line x1="830.5" y1="340" x2="835.5" y2="340" stroke="#091019" stroke-width="1.5" />
          </g>

          <!-- Stick 4 (x=859) -->
          <g class="ram-stick">
            <rect x="861" y="402" width="16" height="6" fill="#d4a74a" opacity=".75" />
            <rect x="859" y="174" width="18" height="230" rx="2.5" fill="#162232" stroke="#2b3d56" stroke-width="1.2" />
            <rect x="860.5" y="176" width="5" height="226" rx="1.5" fill="#2be0ff" opacity=".85" />
            <g fill="#0c131d">
              <rect x="867.5" y="184" width="7.5" height="18" rx="1" />
              <rect x="867.5" y="208" width="7.5" height="18" rx="1" />
              <rect x="867.5" y="232" width="7.5" height="18" rx="1" />
              <rect x="867.5" y="256" width="7.5" height="18" rx="1" />
              <rect x="867.5" y="290" width="7.5" height="18" rx="1" />
              <rect x="867.5" y="314" width="7.5" height="18" rx="1" />
              <rect x="867.5" y="338" width="7.5" height="18" rx="1" />
              <rect x="867.5" y="362" width="7.5" height="18" rx="1" />
            </g>
            <rect x="859" y="278" width="18" height="8" fill="#24354c" />
            <line x1="860.5" y1="220" x2="865.5" y2="220" stroke="#091019" stroke-width="1.5" />
            <line x1="860.5" y1="340" x2="865.5" y2="340" stroke="#091019" stroke-width="1.5" />
          </g>
          <rect id="ram-click" x="795" y="168" width="26" height="244" fill="#2bffa3" opacity="0" filter="url(#glow)" />
        </g>

        <!-- ===== PART: SSD ===== -->
        <g id="part-storage">
          <rect x="478" y="470" width="16" height="40" fill="#04060a" />
          <g id="ssd">
            <rect x="494" y="472" width="280" height="36" rx="3" fill="#101a26" stroke="#24324a" stroke-width="2" />
            <rect x="520" y="479" width="60" height="22" fill="#1c2838" /><rect x="592" y="479" width="60" height="22" fill="#1c2838" />
            <text x="710" y="495" text-anchor="middle" class="mono" font-size="13" fill="#4a5a74">NVMe</text>
            <rect id="ssd-tint" x="494" y="472" width="280" height="36" rx="3" fill="#ff3b4e" opacity=".5" />
          </g>
          <g id="ssd-screw"><circle cx="786" cy="490" r="8" fill="#3a4558" /><path d="M780 490 H792 M786 484 V496" stroke="#0b0f16" stroke-width="2" /></g>
        </g>

        <!-- ===== PART: NETWORK (RJ45 Port & Cat6 Ethernet Cable) ===== -->
        <g id="part-network">
          <!-- Shielded RJ45 Ethernet Socket on Rear I/O -->
          <rect x="401" y="295" width="40" height="38" rx="3.5" fill="#182232" stroke="#364863" stroke-width="1.8" />
          <rect x="405" y="299" width="32" height="30" rx="2" fill="#04060a" stroke="#101722" stroke-width="1" />
          <!-- Recessed RJ45 T-cavity -->
          <path d="M408 307 H434 V321 H427 V326 H415 V321 H408 Z" fill="#010204" />
          <!-- 8 gold contact pins inside socket -->
          <g stroke="#d4a74a" stroke-width="1.2" opacity=".8">
            <line x1="411" y1="308" x2="411" y2="313" /><line x1="414" y1="308" x2="414" y2="313" />
            <line x1="417" y1="308" x2="417" y2="313" /><line x1="420" y1="308" x2="420" y2="313" />
            <line x1="422" y1="308" x2="422" y2="313" /><line x1="425" y1="308" x2="425" y2="313" />
            <line x1="428" y1="308" x2="428" y2="313" /><line x1="431" y1="308" x2="431" y2="313" />
          </g>
          <!-- Port Status LEDs (Link & Activity) -->
          <rect id="nic-led-a" x="407" y="301" width="8" height="4" rx="1" fill="#3a4558" />
          <rect id="nic-led-b" x="427" y="301" width="8" height="4" rx="1" fill="#3a4558" />

          <!-- Braided Cat6 Ethernet Cable (Outer shadow/sheath + inner core + data pulse) -->
          <path id="cable-shadow" d="M -60 780 C 120 780, 150 430, 272 380" fill="none" stroke="#08245c" stroke-width="14" stroke-linecap="round" />
          <path id="cable" d="M -60 780 C 120 780, 150 430, 272 380" fill="none" stroke="#1d6fff" stroke-width="10" stroke-linecap="round" />
          <path id="cable-highlight" d="M -60 780 C 120 780, 150 430, 272 380" fill="none" stroke="#66a6ff" stroke-width="2.5" stroke-linecap="round" opacity=".55" />
          <path id="cable-pulse" d="M -60 780 C 140 780, 200 314, 366 314" fill="none" stroke="#bff6ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 280" stroke-dashoffset="0" opacity="0" filter="url(#glow)" />

          <!-- Detailed RJ45 Connector Plug (positioned dynamically with cable tip via JS) -->
          <g id="plug">
            <!-- Strain relief boot with ribs (starts at x=-26 relative to plug origin, crystal tip extends to +24) -->
            <path d="M-26 -8 L-12 -11 L6 -11 L6 11 L-12 11 L-26 8 Z" fill="#1557d6" stroke="#2f7bff" stroke-width="1" />
            <g fill="#0b358a">
              <rect x="-21" y="-8" width="2.5" height="16" rx="1" />
              <rect x="-16" y="-9" width="2.5" height="18" rx="1" />
              <rect x="-11" y="-10" width="2.5" height="20" rx="1" />
            </g>
            <!-- Top retention latch clip -->
            <path d="M-2 -11 L16 -15 L18 -12 L4 -9 Z" fill="#9ec5ff" opacity=".85" />
            <!-- Clear polycarbonate RJ45 head -->
            <rect x="6" y="-9" width="18" height="18" rx="2" fill="#d9ecff" fill-opacity=".88" stroke="#7ab3ff" stroke-width="1.2" />
            <!-- Internal twisted-pair wires visible inside clear head -->
            <line x1="6" y1="-4" x2="17" y2="-4" stroke="#2b7bff" stroke-width="2" />
            <line x1="6" y1="0" x2="17" y2="0" stroke="#24b47e" stroke-width="2" />
            <line x1="6" y1="4" x2="17" y2="4" stroke="#f59e0b" stroke-width="2" />
            <!-- Gold contact blades at the very tip -->
            <g fill="#f2c14e">
              <rect x="18" y="-7" width="5" height="2" rx=".5" />
              <rect x="18" y="-3.5" width="5" height="2" rx=".5" />
              <rect x="18" y="0" width="5" height="2" rx=".5" />
              <rect x="18" y="3.5" width="5" height="2" rx=".5" />
            </g>
          </g>
          <!-- Click flash when RJ45 locks into socket -->
          <rect id="net-click" x="396" y="290" width="50" height="48" rx="6" fill="#2bffa3" opacity="0" filter="url(#glow)" />
        </g>

        <!-- highlight frames -->
        <g class="frames" fill="none" stroke-width="3" opacity="0">
          <rect id="frame-ram" x="755" y="156" width="138" height="266" rx="10" stroke="#ff3b4e" />
          <rect id="frame-storage" x="466" y="458" width="336" height="64" rx="10" stroke="#ff3b4e" />
          <rect id="frame-network" x="380" y="286" width="82" height="56" rx="10" stroke="#ff3b4e" />
          <rect id="frame-cpu" x="512" y="182" width="216" height="216" rx="18" stroke="#ff3b4e" />
        </g>

        <!-- status pills (text filled from content.js) -->
        <g class="statuses" opacity="0">
          <g id="status-ram" class="status" transform="translate(755 120)">
            <rect width="190" height="28" rx="14" fill="#0b0f16" stroke="#2a3344" />
            <text class="st-fault mono" x="95" y="19" text-anchor="middle" font-size="13" fill="#ff3b4e"></text>
            <text class="st-fixed mono" x="95" y="19" text-anchor="middle" font-size="13" fill="#2bffa3" opacity="0"></text>
          </g>
          <g id="status-storage" class="status" transform="translate(466 528)">
            <rect width="190" height="28" rx="14" fill="#0b0f16" stroke="#2a3344" />
            <text class="st-fault mono" x="95" y="19" text-anchor="middle" font-size="13" fill="#ff3b4e"></text>
            <text class="st-fixed mono" x="95" y="19" text-anchor="middle" font-size="13" fill="#2bffa3" opacity="0"></text>
          </g>
          <g id="status-network" class="status" transform="translate(470 300)">
            <rect width="190" height="28" rx="14" fill="#0b0f16" stroke="#2a3344" />
            <text class="st-fault mono" x="95" y="19" text-anchor="middle" font-size="13" fill="#ff3b4e"></text>
            <text class="st-fixed mono" x="95" y="19" text-anchor="middle" font-size="13" fill="#2bffa3" opacity="0"></text>
          </g>
          <g id="status-cpu" class="status" transform="translate(525 146)">
            <rect width="190" height="28" rx="14" fill="#0b0f16" stroke="#2a3344" />
            <text class="st-fault mono" x="95" y="19" text-anchor="middle" font-size="13" fill="#ff3b4e"></text>
            <text class="st-fixed mono" x="95" y="19" text-anchor="middle" font-size="13" fill="#2bffa3" opacity="0"></text>
          </g>
          <!-- OS install progress -->
          <g id="os-progress" transform="translate(666 534)" opacity="0">
            <rect width="140" height="8" rx="4" fill="#141b27" />
            <rect id="os-progress-bar" width="0" height="8" rx="4" fill="#2be0ff" />
          </g>
        </g>

        <!-- scan line -->
        <rect id="scan" x="290" y="80" width="40" height="740" fill="url(#g-scan)" opacity="0" />

        <!-- technician's screwdriver (tip at 0,0) -->
        <g id="tool" opacity="0">
          <g transform="rotate(-35)">
            <path d="M-2 0 L2 0 L3 -8 L-3 -8 Z" fill="#e6edf5" />
            <rect x="-3" y="-80" width="6" height="74" fill="#c3ccd8" />
            <rect x="-12" y="-158" width="24" height="80" rx="9" fill="#f2b233" />
            <rect x="-12" y="-140" width="24" height="5" fill="#0b0f16" opacity=".35" />
            <rect x="-12" y="-125" width="24" height="5" fill="#0b0f16" opacity=".35" />
          </g>
        </g>

        <!-- glass side panel -->
        <g id="glass">
          <rect x="300" y="80" width="1000" height="740" rx="18" fill="#9cc3ff" fill-opacity=".07" stroke="#9cc3ff" stroke-opacity=".25" stroke-width="3" />
          <path d="M420 80 L300 260 M560 80 L300 470 M640 80 L590 155" stroke="#ffffff" stroke-opacity=".06" stroke-width="22" />
          <circle cx="324" cy="104" r="7" fill="#3a4558" /><circle cx="1276" cy="104" r="7" fill="#3a4558" />
          <circle cx="324" cy="796" r="7" fill="#3a4558" /><circle cx="1276" cy="796" r="7" fill="#3a4558" />
        </g>
      </svg>

      <!-- ============ OVERLAYS ============ -->
      <header class="hud" id="hud">
        <div class="brand mono">M<span>.</span>A</div>
        <div class="health">
          <span class="mono health-label">SYSTEM HEALTH</span>
          <div class="health-bar"><i id="health-fill"></i></div>
          <span class="mono" id="health-value">0%</span>
        </div>
        <ol class="steps mono" id="steps"></ol>
      </header>

      <div id="cards"></div>

      <div class="hint" id="hint">
        <span class="mouse"><i></i></span>
        <span>انزل للأسفل</span>
      </div>

      <section class="final" id="final">
        <div class="final-header">
          <span class="status-badge mono"><i class="pulse-dot"></i>ONLINE · SYSTEM RESTORED</span>
          <span class="id-code mono">TECH-ID // MA-01</span>
        </div>
        <div class="final-identity">
          <div class="avatar-mark mono">MA</div>
          <div class="final-titles">
            <h2 id="final-name"></h2>
            <p class="final-title mono" id="final-title"></p>
          </div>
        </div>
        <div class="final-specs mono">
          <span><b>STATUS</b> VERIFIED ✓</span>
          <span><b>UPTIME</b> 100%</span>
          <span><b>LOC</b> NAJRAN, SA</span>
        </div>
        <p class="final-line" id="final-line"></p>
        <nav class="contacts" id="contacts"></nav>
      </section>
    </div>
  </main>

  <!-- reduced-motion fallback -->
  <section id="static-summary" class="static-summary"></section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
